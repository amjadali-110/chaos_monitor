name: Chaos Monitor

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

concurrency:
  group: chaos-monitor-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set run timestamp
        run: echo "RUN_TS=$(date +'%d-%m-%y-%H-%M')" >> "$GITHUB_ENV"
      
      - name: Restore previous downloads cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: downloads
          key: chaos-monitor-downloads-${{ github.ref_name }}-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            chaos-monitor-downloads-${{ github.ref_name }}-${{ runner.os }}-
            chaos-monitor-downloads-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run chaos monitor
        env:
          CHAOS_INDEX_URL: https://chaos-data.projectdiscovery.io/index.json
          DOWNLOAD_DIR: downloads
          OUTPUTS_DIR: outputs
          LOG_FILE: chaos_monitor.log
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p downloads
          python chaos_monitor.py || true

      - name: Upload downloaded ZIPs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-downloads-${{ github.run_id }}
          path: downloads/**

      - name: Upload outputs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-outputs-${{ github.run_id }}-${{ env.RUN_TS }}
          path: outputs/**
          if-no-files-found: ignore

      - name: Commit outputs to repo
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git add outputs
          if ! git diff --cached --quiet; then
            git commit -m "ci(outputs): add results for ${{ github.run_id }} (${RUN_TS}) [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes in outputs to commit."

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-logs-${{ github.run_id }}
          path: |
            chaos_monitor.log

      - name: Save updated downloads cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: downloads
          key: chaos-monitor-downloads-${{ github.ref_name }}-${{ runner.os }}-${{ github.run_id }}
