name: Chaos Monitor

on:
  schedule:
    - cron: "0 * * * *"  # hourly
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: chaos-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Ensure GOPATH/bin on PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install ProjectDiscovery tools (dnsx, httpx, nuclei)
        run: |
          go install -v github.com/projectdiscovery/dnsx/cmd/dnsx@latest
          go install -v github.com/projectdiscovery/httpx/cmd/httpx@latest
          go install -v github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest

      - name: Verify tools
        run: |
          which dnsx && dnsx -version || true
          which httpx && httpx -version || true
          which nuclei && nuclei -version || true

      - name: Update nuclei templates (optional)
        run: |
          nuclei -ut || true

      - name: Run Chaos Monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python chaos_monitor.py

      - name: Upload outputs and logs
        uses: actions/upload-artifact@v4
        with:
          name: chaos-monitor-outputs
          if-no-files-found: ignore
          path: |
            outputs/**
            chaos_monitor.log

      - name: Upload downloads (debug)
        uses: actions/upload-artifact@v4
        with:
          name: chaos-monitor-downloads
          if-no-files-found: ignore
          path: downloads/**
