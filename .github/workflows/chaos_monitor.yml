name: Chaos Monitor

on:
  schedule:
    - cron: "0 * * * *"  # hourly
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: chaos-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Chaos Monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python chaos_monitor.py

      - name: Upload outputs and logs
        uses: actions/upload-artifact@v4
        with:
          name: chaos-monitor-outputs
          if-no-files-found: ignore
          path: |
            outputs/**
            chaos_monitor.log

      - name: Upload downloads (debug)
        uses: actions/upload-artifact@v4
        with:
          name: chaos-monitor-downloads
          if-no-files-found: ignore
          path: downloads/**
